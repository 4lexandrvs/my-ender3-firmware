name: Marlin Firmware Build (Fixed)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your config repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Clone official Marlin 2.1.x
        run: |
          # Скачиваем официальную стабильную ветку Marlin 2.1.x
          git clone --depth 1 --branch 2.1.2.6 https://github.com/MarlinFirmware/Marlin.git MarlinSource

      - name: Copy custom configuration
        run: |
          # Копируем ваши отредактированные файлы в скачанную папку Marlin
          cp autogeneratedConfigs/autoLevel5x5Lin/stable/2.1.2.8/Configuration.h MarlinSource/Marlin/Configuration.h
          cp autogeneratedConfigs/autoLevel5x5Lin/stable/2.1.2.8/Configuration_adv.h MarlinSource/Marlin/Configuration_adv.h
          # Копируем файлы кастомной заставки
          cp autogeneratedConfigs/autoLevel5x5Lin/stable/2.1.2.8/_Bootscreen.h MarlinSource/Marlin/_Bootscreen.h
          cp autogeneratedConfigs/autoLevel5x5Lin/stable/2.1.2.8/_Statusscreen.h MarlinSource/Marlin/_Statusscreen.h
          
          echo "Configuration files copied successfully!"

      - name: Build Marlin
        run: |
          cd MarlinSource
          pio run -e STM32F103RE_creality

      - name: Rename firmware to standard name
        run: |
          # Находим файл прошивки (с датой в имени) и переименовываем его
          cd MarlinSource/.pio/build/STM32F103RE_creality/
          ls -la
          # Копируем любой файл firmware-*.bin в firmware.bin
          cp firmware-*.bin firmware.bin
          echo "✅ Firmware renamed to firmware.bin"
          ls -la firmware.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Firmware Build #${{ github.run_number }}
          body: |
            ## 🖨️ Прошивка для Ender-3 с платой 4.2.7
            
            **Конфигурация:**
            - Плата: Creality v4.2.7 (STM32F103RE, 512K)
            - Экструдер: Sprite SE (steps: 424.9)
            - Автоуровень: CR-Touch, сетка 5x5
            - Linear Advance: K=0.05 (для PETG)
            - S-Curve Acceleration: ✅
            - Input Shaping: ✅
            - Преднагрев 1: PETG (235°C / 75°C)
            
            **Marlin версия:** 2.1.2.6
            
            ### 📥 Как установить:
            1. Скачайте `firmware.bin`
            2. Скопируйте на microSD-карту (FAT32)
            3. Выключите принтер, вставьте карту
            4. Включите принтер — прошивка начнётся автоматически
            5. После загрузки вытащите карту
          files: |
            MarlinSource/.pio/build/STM32F103RE_creality/firmware.bin
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
