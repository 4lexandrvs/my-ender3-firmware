name: Marlin Firmware Build (Fixed)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Copy custom configuration
        run: |
          # Копируем наши отредактированные файлы в основную папку Marlin
          cp autogeneratedConfigs/auto_level_5x5_lin/Configuration.h Marlin/Configuration.h
          cp autogeneratedConfigs/auto_level_5x5_lin/Configuration_adv.h Marlin/Configuration_adv.h
          echo "Configuration files copied successfully!"

      - name: Build Marlin
        run: |
          # Собираем прошивку для платы Creality 4.2.7 (512K)
          pio run -e STM32F103RE_creality

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ender3-427-sprite-se
          path: .pio/build/STM32F103RE_creality/firmware.bin
